# SPDX-License-Identifier: MIT
description: |
  Repeatedly taps the bound behavior while the key is held (firmware auto-repeat).

compatible: "zmk,behavior-tap-repeat"

include: zero_param.yaml

properties:
  bindings:
    type: phandle-array
    required: true
  wait-ms:
    type: int
    default: 250
  tap-ms:
    type: int
    default: 100
